<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#F3E8FF" opacity="0.3"/>
  <circle cx="100" cy="100" r="90" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="85" fill="#FAF5FF"/>
  
  <!-- Invoice Document -->
  <rect x="45" y="40" width="70" height="85" rx="6" fill="#7C3AED" opacity="0.1"/>
  <rect x="45" y="40" width="70" height="85" rx="6" fill="none" stroke="#7C3AED" stroke-width="2"/>
  
  <!-- Invoice Lines -->
  <line x1="55" y1="60" x2="100" y2="60" stroke="#A855F7" stroke-width="1.5" opacity="0.6"/>
  <line x1="55" y1="75" x2="95" y2="75" stroke="#A855F7" stroke-width="1.5" opacity="0.6"/>
  <line x1="55" y1="90" x2="97" y2="90" stroke="#A855F7" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Currency Symbol/Amount -->
  <circle cx="105" cy="105" r="2" fill="#9333EA"/>
  <line x1="70" y1="105" x2="100" y2="105" stroke="#9333EA" stroke-width="2"/>
  
  <!-- Cosmetics Elements -->
  <!-- Lipstick -->
  <rect x="55" y="65" width="5" height="25" rx="2.5" fill="#EC4899" stroke="#BE185D" stroke-width="1"/>
  <polygon points="52.5,62 57.5,62 56,52 54,52" fill="#EC4899" stroke="#BE185D" stroke-width="1"/>
  <circle cx="55" cy="75" r="8" fill="none" stroke="#BE185D" stroke-width="1.5" opacity="0.8"/>
  <circle cx="55" cy="75" r="2" fill="#BE185D" opacity="0.7"/>
  
  <!-- Mascara/Brush -->
  <rect x="75" y="45" width="1.5" height="20" fill="#6B46C1" stroke="#553C9A"/>
  <ellipse cx="76.75" cy="35" rx="3" ry="6" fill="#E879F9" transform="rotate(-20 76.75 42)" opacity="0.9"/>
  <polygon points="74,38 80,38 78,45 76,45" fill="#E879F9" stroke="#C026D3"/>
  
  <!-- Checkmark on Invoice -->
  <path d="M50 105 L55 110 L65 98" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Sparkles/Decorative Elements -->
  <g opacity="0.7">
    <!-- Sparkle 1 -->
    <path d="M30 30 L32 32 L34 30 L32 28 Z" fill="#9333EA"/>
    <!-- Sparkle 2 -->
    <path d="M170 35 L172 37 L174 35 L172 33 Z" fill="#A855F7"/>
    <!-- Sparkle 3 -->
    <path d="M155 165 L157 167 L159 165 L157 163 Z" fill="#C026D3"/>
  </g>
  
  <!-- App Name -->
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4C1D95" opacity="0.9">Fatturare</text>
</svg>
